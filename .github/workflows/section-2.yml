name: Section 2 Lean build

"on":
  push:
    branches:
      - main
    paths:
      - "section 2/**"
      - ".github/workflows/section-2.yml"
  pull_request:
    branches:
      - main
    paths:
      - "section 2/**"
      - ".github/workflows/section-2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Section 2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build Lean project
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          lake-package-directory: "section 2"
          auto-config: "false"
          build: "true"
          use-mathlib-cache: "true"
          use-github-cache: "false"
